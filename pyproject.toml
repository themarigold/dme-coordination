[project]
name = "dme-coordination"
version = "0.1.0"
description = "Prototype: automated Medicare DME order coordination (take-home)"
requires-python = ">=3.12"
dependencies = [
  "anthropic>=2.10,<3",
  "pydantic>=2.7,<3",
  "pyyaml>=6",
  "python-dotenv>=1",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dme"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls the real Claude API (needs ANTHROPIC_API_KEY in .env)"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 120
# eval/run_eval.py is hash-pinned by eval/MANIFEST.sha256, so it keeps its own formatting.
extend-exclude = ["eval/run_eval.py"]
