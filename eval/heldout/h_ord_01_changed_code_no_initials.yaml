item_id: h_ord_01_changed_code_no_initials
reader: read_order_document
goal: >-
  Read the written order received from Dr. Sarah Chen's office for Eleanor Martinez: the six order
  elements, the item and HCPCS code exactly as written, the signature, and any changes.
context_facts:
  patient.name: Eleanor Martinez
  order.item_requested: standard manual wheelchair
  order.hcpcs_expected: K0001
  pcp.name: Dr. Sarah Chen
  order.version: "1"
text: |
  SUNRISE FAMILY MEDICINE  ** fax **  11/19/2026  pg 1/1

  Written Order -- Durable Medical Equipment
  Name: Eleanor Martinez    Medicare: 1EG4-TE5-MK00    DOB 03/14/1954
  Date ordered: 11/19/2026

  Equipment: High strength lightweight wheelchair
  HCPCS: K0004
  Qty: 1   (handwritten over a printed "2")

  Prescriber: Sarah Chen MD    NPI: 9999999999
  Signed: [handwritten signature] Sarah Chen    11/19/26
labels:
  hcpcs_code: {status: found, value: K0004}
  item_description: {status: found, value: High strength lightweight wheelchair}
  has_changes: {status: found, value: "yes"}
  changes_initialled_dated: {status: found, value: "no"}
  signature_present: {status: found, value: "yes"}
  quantity: {status: contradictory}
tags: [wrong_item_code, uninitialled_change, correction]
notes: >-
  Wrong item (K0004) plus an un-initialled quantity change. quantity = contradictory (ambiguous also
  accepted): the printed 2 and the handwritten 1 are both on the page; validity is left to
  has_changes / changes_initialled_dated, as in ord_04. The text does not state that initials are absent; the reader has to notice.
