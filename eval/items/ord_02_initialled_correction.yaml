item_id: ord_02_initialled_correction
reader: read_order_document
goal: >-
  Read the written order received from Dr. Sarah Chen's office for Eleanor Martinez: the six order
  elements, the item and HCPCS code exactly as written, the signature, and any changes.
context_facts:
  patient.name: Eleanor Martinez
  order.item_requested: standard manual wheelchair
  order.hcpcs_expected: K0001
  pcp.name: Dr. Sarah Chen
  order.version: "2"
text: |
  11/20/2026 10:02  FROM: SUNRISE FAMILY MED                       P. 001/001
  ** CORRECTED ORDER **

  STANDARD WRITTEN ORDER -- DME
  Patient: Eleanor Martinez     DOB 03/14/1954     MBI 1EG4-TE5-MK00
  Order date: 11/19/2026

  Item: Standard manual wheelchair    HCPCS: K0003 (struck through)   K0001  SC 11/20/26 (handwritten)
  Qty: 1
  Length of need: 99 mo

  Ordering practitioner: Sarah Chen, MD      NPI 9999999999
  Signature: [handwritten signature] Sarah Chen MD   11/19/2026
labels:
  has_changes: {status: found, value: "yes"}
  changes_initialled_dated: {status: found, value: "yes"}
  signature_present: {status: found, value: "yes"}
  quantity: {status: found, value: "1"}
  hcpcs_code: {status: found, value: K0001}
tags: [initialled_correction, correction]
notes: >-
  Pair with ord_04. The struck-through code is corrected and the handwritten correction carries the
  practitioner's initials (SC = Sarah Chen) and a date, so the correction stands: hcpcs_code is the
  corrected K0001. The text does not say outright that "SC 11/20/26" are initials and a date; the
  reader has to recognise them.
