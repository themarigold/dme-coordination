item_id: ord_01_wrong_item_code
reader: read_order_document
goal: >-
  Read the written order received from Dr. Sarah Chen's office for Eleanor Martinez: the six order
  elements, the item and HCPCS code exactly as written, the signature, and any changes.
context_facts:
  patient.name: Eleanor Martinez
  order.item_requested: standard manual wheelchair
  order.hcpcs_expected: K0001
  pcp.name: Dr. Sarah Chen
  order.version: "1"
text: |
  11/19/2026 16:20  FROM: SUNRISE FAMILY MED  (312) 555-0198      P. 001/001

  SUNRISE FAMILY MEDICINE
  Chicago IL
  STANDARD WRITTEN ORDER -- DURABLE MEDICAL EQUIPMENT

  Patient: Eleanor Martinez          DOB: 03/14/1954
  Medicare ID: 1EG4-TE5-MK00
  Order date: 11/19/2026

  Item: Lightweight manual wheelchair          HCPCS: K0003
  Qty: 1
  Length of need: 99 months (lifetime)
  Dx: M17.0 bilat primary OA knee; R26.89 other abnormalities of gait

  Ordering practitioner: Sarah Chen, MD       NPI: 9999999999
  Signature: /Sarah Chen MD/  electronically signed 11/19/2026 4:12 PM

